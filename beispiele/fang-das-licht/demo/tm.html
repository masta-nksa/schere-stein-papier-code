<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Teachable Machine (iframe)</title>
  <style>
    body { margin: 0; background: transparent; font-family: system-ui, sans-serif; }
    canvas { width: 160px; height: 160px; border-radius: 8px; display: block; }
  </style>
</head>
<body>
  <div id="box"></div>

  <!-- Läuft bewusst in einem eigenen iframe: Teachable Machine braucht tfjs 1.x,
       ml5 bringt sein eigenes tfjs mit. In einer Seite beissen sich die beiden. -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script>
    // Der Elternseite (game.js) mitteilen, was erkannt wurde
    function tell(msg) { parent.postMessage(Object.assign({ from: 'tm' }, msg), location.origin); }

    function classToDir(name) {
      const n = name.toLowerCase();
      if (n.includes('links') || n.includes('left')) return -1;
      if (n.includes('rechts') || n.includes('right')) return 1;
      return 0;
    }

    let model = null, webcam = null, running = false;

    async function start(url) {
      if (!url.endsWith('/')) url += '/';
      try {
        tell({ status: 'Modell wird geladen …' });
        model = await tmImage.load(url + 'model.json', url + 'metadata.json');
        webcam = new tmImage.Webcam(200, 200, true);   // true = gespiegelt
        await webcam.setup();
        await webcam.play();
        document.getElementById('box').appendChild(webcam.canvas);
        running = true;
        tell({ status: 'Kamera läuft. Zeige links / rechts / nichts.' });
        requestAnimationFrame(loop);
      } catch (e) {
        tell({ status: 'Fehler: ' + (e.message || e.name || e) + ' (Link korrekt? Kamera erlaubt?)' });
      }
    }

    async function loop() {
      if (!running) return;
      webcam.update();
      const preds = await model.predict(webcam.canvas);
      let best = preds[0];
      for (const p of preds) if (p.probability > best.probability) best = p;
      const dir = best.probability > 0.7 ? classToDir(best.className) : 0;
      tell({ dir, text: 'Erkannt: ' + best.className + ' (' + Math.round(best.probability * 100) + ' %)' });
      requestAnimationFrame(loop);
    }

    window.addEventListener('message', (ev) => {
      if (ev.origin !== location.origin) return;
      if (ev.data && ev.data.cmd === 'start') start(ev.data.url);
    });
    tell({ ready: true });
  </script>
</body>
</html>
